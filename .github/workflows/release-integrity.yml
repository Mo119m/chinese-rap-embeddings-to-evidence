name: Release integrity

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu / core.autocrlf=input
            os: ubuntu-latest
            autocrlf: input
          - name: Windows / core.autocrlf=true
            os: windows-latest
            autocrlf: "true"
          - name: Ubuntu / core.autocrlf=false
            os: ubuntu-latest
            autocrlf: "false"

    steps:
      - name: Configure checkout line endings
        shell: bash
        run: git config --global core.autocrlf "${{ matrix.autocrlf }}"

      - name: Check out committed bytes
        uses: actions/checkout@v4

      - name: Use Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check source syntax
        run: python -m compileall -q src

      - name: Check UTF-8 and LF contract
        run: python src/normalize_public_text_v1.py

      - name: Validate committed release
        run: python src/validate_public_release_integrity_v1.py

      - name: Confirm manuscript derivatives match their sources
        run: python tools/check_manuscript_derivatives.py

      - name: Confirm every tracked path is byte-frozen
        shell: bash
        run: |
          git ls-files --eol | awk '
            { index_eol = substr($1, 3); worktree_eol = substr($2, 3)
              if (index_eol != worktree_eol || $3 != "attr/-text") { print; bad = 1 } }
            END { exit bad ? 1 : 0 }'

      - name: Prove release rebuild is idempotent
        run: python src/build_chinese_rap_release_v4.py --reuse-generated-at

      - name: Validate rebuilt release
        run: python src/validate_public_release_integrity_v1.py

      - name: Reject stale or untracked generated artifacts
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Build desktop release outside the checkout
        run: python src/build_chinese_rap_release_v4.py --reuse-generated-at --desktop "${{ runner.temp }}/Chinese_Rap_Research_Release_V4"

      - name: Validate desktop directory and ZIP
        run: python src/validate_public_release_integrity_v1.py --desktop "${{ runner.temp }}/Chinese_Rap_Research_Release_V4"

      - name: Confirm desktop build did not alter the release
        shell: bash
        run: |
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"
